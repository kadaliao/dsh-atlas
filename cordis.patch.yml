- insert:
    - id: atlas
      name: '@kadaliao/dsh-atlas'
      config:
        enabled: true
        # A Photos library to read; empty finds the one Photos opens by default.
        library: ''
        # Fetch "on this day in history" from Wikipedia (only the date is sent).
        history: true
        # night (OpenFreeMap at night) | amap (Amap inside China) |
        # satellite (Esri imagery) | offline (the bundled outline map only).
        basemap: night
        # Zoomed in, ask Wikipedia what is around the map's centre (sends that point).
        nearby: true
        # A photo further than this from home (km) counts as a trip.
        awayKm: 100
